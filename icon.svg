<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="ASCII H3 Director">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dff4a"/>
      <stop offset="0.55" stop-color="#3ea6ff"/>
      <stop offset="1" stop-color="#ff2f45"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#7dff4a" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7dff4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#050506"/>
  <rect width="256" height="256" rx="56" fill="url(#halo)"/>

  <!-- concentric character rings: the tunnel this plugin directs -->
  <g fill="none" stroke="url(#g)" stroke-width="2.4" opacity="0.95">
    <circle cx="128" cy="120" r="86" stroke-dasharray="4 7" opacity="0.5"/>
    <circle cx="128" cy="120" r="66" stroke-dasharray="6 6" opacity="0.68"/>
    <circle cx="128" cy="120" r="46" stroke-dasharray="8 5" opacity="0.85"/>
  </g>

  <!-- the focal cursor mark everything implodes into -->
  <rect x="122" y="112" width="12" height="16" rx="2" fill="#ff2f45"/>
  <rect x="126" y="106" width="2.5" height="6" fill="#ff2f45"/>

  <!-- structural type: A S C I I as a real glyph wall -->
  <g fill="#f2f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="27" font-weight="700" letter-spacing="3.4" text-anchor="middle">
    <text x="128" y="212">ASCII</text>
  </g>
  <g fill="#7dff4a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
     font-size="15" letter-spacing="5.5" text-anchor="middle" opacity="0.9">
    <text x="128" y="234">H 3 · D I R E C T O R</text>
  </g>
</svg>
